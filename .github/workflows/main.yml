name: QuickBite CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build All Microservices
        run: |
          mvn clean package -DskipTests -B

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Images
        run: |
          # Build and push each service
          # In a real scenario, we would use a loop or matrix, but for simplicity:
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-auth:latest ./auth-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-auth:latest
          
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-gateway:latest ./api-gateway
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-gateway:latest
          
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-restaurant:latest ./restaurant-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-restaurant:latest
          
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-admin:latest ./admin-server
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/quickbite-admin:latest
          
          # ... add other services as needed

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ec2-user
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            cd ~/QuickBite
            docker-compose pull
            docker-compose up -d
